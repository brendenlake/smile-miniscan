<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miniscan Grammar Visualizer</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #222; margin: 0; padding: 20px; }
    h1 { margin: 0 0 16px; font-size: 1.5em; }
    .grammar-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
    .tab-btn { padding: 7px 16px; border: 2px solid #ccc; border-radius: 6px; background: white; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.15s; }
    .tab-btn.active { border-color: #3b82f6; background: #3b82f6; color: white; }
    .tab-btn:hover:not(.active) { border-color: #93c5fd; background: #eff6ff; }

    .legend { background: white; border-radius: 10px; padding: 18px 22px; margin-bottom: 18px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .legend-section-title { font-size: 0.78em; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 10px; }
    .prim-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
    .prim-card { border-radius: 8px; padding: 10px 13px; border: 2px solid; }
    .prim-sym { font-size: 0.72em; color: #777; font-weight: 700; margin-bottom: 3px; }
    .prim-word { font-size: 1.15em; font-weight: 800; margin-bottom: 4px; }
    .prim-color-row { display: flex; align-items: center; gap: 6px; font-size: 0.78em; color: #555; }
    .dot { display: inline-block; width: 13px; height: 13px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.2); flex-shrink: 0; }
    .mod-row { display: flex; gap: 14px; flex-wrap: wrap; }
    .mod-card { background: #f4f4f6; border-radius: 7px; padding: 9px 14px; }
    .mod-sym { font-size: 0.72em; color: #888; font-weight: 700; }
    .mod-word { font-size: 1.05em; font-weight: 800; margin: 2px 0 3px; }
    .mod-rule { font-size: 0.76em; color: #666; font-family: 'Courier New', monospace; }

    .stage-section { background: white; border-radius: 10px; padding: 16px 20px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .stage-header { font-size: 0.95em; font-weight: 700; margin: 0 0 14px; padding-bottom: 9px; border-bottom: 1px solid #eee; color: #333; }
    .stage-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .col-label { font-size: 0.75em; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }

    .stim-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; flex-wrap: wrap; }
    .stim-input { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.84em; font-weight: 700; line-height: 1.4; }
    .badge-mod { background: #e8e8ec; color: #444; border: 1px solid #ccc; }
    .arrow { color: #aaa; font-size: 1.1em; flex-shrink: 0; }
    .stim-output { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
    .circle { display: inline-block; width: 24px; height: 24px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.18); flex-shrink: 0; }
    .catch-tag { font-size: 0.68em; color: #bbb; font-style: italic; }
    .status { color: #888; padding: 20px 0; }
    .error { color: #c00; padding: 20px 0; }
  </style>
</head>
<body>

<h1>Miniscan Grammar Visualizer</h1>
<div class="grammar-tabs" id="tabs"></div>
<div id="viz"><p class="status">Loading…</p></div>

<script>
// color name → hex as used in the grammar comment blocks
const COLOR_HEX = { RED:'#ff0000', BLUE:'#0000ff', GREEN:'#33cc33', YELLOW:'#b7b600', PURPLE:'#ce9fcf', PINK:'#00b0b3' }
const COLOR_NAMES = new Set(Object.keys(COLOR_HEX))
const VARS        = new Set(['u1', 'u2', 'x1', 'x2'])
// const GRAMMAR_NUMS = [1, 2, 3, 4, 6, 7, 8, 9]
const GRAMMAR_NUMS = [12, 18, 41, 44, 55, 126, 150, 163]

// ── parsing ──────────────────────────────────────────────────────────────────

// Extract an `export const <name> = [ ... ]` block and return each row as
// [inputStr, outputStr, isCatch].
function parseStims(text, varName) {
  const marker = `export const ${varName}`
  const defStart = text.indexOf(marker)
  if (defStart === -1) return []

  const arrOpen = text.indexOf('[', defStart)
  if (arrOpen === -1) return []

  // walk to matching ']'
  let depth = 0, i = arrOpen, arrClose = -1
  while (i < text.length) {
    if      (text[i] === '[') depth++
    else if (text[i] === ']') { depth--; if (depth === 0) { arrClose = i; break } }
    i++
  }
  if (arrClose === -1) return []

  const stims = []
  for (const line of text.slice(arrOpen, arrClose + 1).split('\n')) {
    const m = line.match(/\[\s*'([^']+)'\s*,\s*'([^']+)'\s*\]/)
    if (m) stims.push([m[1], m[2], /\/\/\s*catch trial/.test(line)])
  }
  return stims
}

// Parse the '// Grammar:' comment block to extract primitive and modifier
// assignments.  Returns { primitives: [{sym,word,name}], modifiers: [{sym,word,rule}] }.
function parseGrounding(text) {
  const blockStart = text.indexOf('// Grammar:')
  if (blockStart === -1) return { primitives: [], modifiers: [] }

  const primitives = [], modifiers = []

  for (const line of text.slice(blockStart).split('\n')) {
    const s = line.replace(/^\/\/\s*/, '').trim()
    if (!s || !s.includes('->')) continue

    const arrow = s.indexOf('->')
    const lhs   = s.slice(0, arrow).trim()
    const rhs   = s.slice(arrow + 2).trim()

    if (COLOR_NAMES.has(rhs)) {
      // e.g. "fep -> YELLOW"
      primitives.push({ word: lhs, name: rhs })
    } else if (rhs.includes('[')) {
      // e.g. "u1 zup x1 -> [u1] [x1]"  — the non-variable token is the modifier word
      const word = lhs.split(/\s+/).find(t => !VARS.has(t))
      if (word) modifiers.push({ word, rule: `${lhs} → ${rhs}` })
    }
  }

  return {
    primitives: primitives.slice(0, 4).map((p, i) => ({ sym: `p${i + 1}`, ...p })),
    modifiers:  modifiers.slice(0, 3).map((m, i) => ({ sym: `m${i + 1}`, ...m })),
  }
}

async function loadGrammar(num) {
  const text = await fetch(`./miniscan_grammar_${num}.js`).then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status}`)
    return r.text()
  })
  return {
    ...parseGrounding(text),
    stages: [
      { num: 1, train: parseStims(text, 'stims1_train'), test: parseStims(text, 'stims1_test') },
      { num: 2, train: parseStims(text, 'stims2_train'), test: parseStims(text, 'stims2_test') },
      { num: 3, train: parseStims(text, 'stims3_train'), test: parseStims(text, 'stims3_test') },
      { num: 4, train: parseStims(text, 'stims4_train'), test: parseStims(text, 'stims4_test') },
    ],
  }
}

// ── rendering ─────────────────────────────────────────────────────────────────

function luma(h) {
  const r = parseInt(h.slice(1,3),16), g = parseInt(h.slice(3,5),16), b = parseInt(h.slice(5,7),16)
  return (0.299*r + 0.587*g + 0.114*b) / 255
}
function textColor(h) { return luma(h) > 0.48 ? '#111' : '#fff' }

function colorMapFor(g) {
  const m = {}
  g.primitives.forEach((p, i) => { m[`c${i + 1}`] = COLOR_HEX[p.name] })
  return m
}

function renderToken(tok, g) {
  const prim = g.primitives.find(p => p.sym === tok)
  const mod  = g.modifiers.find(m => m.sym === tok)
  if (prim) {
    const bg = COLOR_HEX[prim.name] || '#ccc', fg = textColor(bg)
    return `<span class="badge" style="background:${bg};color:${fg};">${prim.word}</span>`
  }
  if (mod) return `<span class="badge badge-mod">${mod.word}</span>`
  return `<span class="badge badge-mod">${tok}</span>`
}

function renderStimRow(stim, g) {
  const cmap   = colorMapFor(g)
  const inHTML  = stim[0].split(' ').map(t => renderToken(t, g)).join('')
  const outHTML = stim[1].split(' ').map(t => {
    const c = cmap[t]
    return c ? `<span class="circle" style="background:${c};" title="${t}"></span>` : `<span>${t}</span>`
  }).join('')
  const catchHTML = stim[2] ? '<span class="catch-tag">catch</span>' : ''
  return `<div class="stim-row"><div class="stim-input">${inHTML}</div><span class="arrow">→</span><div class="stim-output">${outHTML}</div>${catchHTML}</div>`
}

function renderGrammarHTML(g) {
  const primCards = g.primitives.map(p => {
    const bg = COLOR_HEX[p.name] || '#ccc'
    return `<div class="prim-card" style="border-color:${bg};background:${bg}1a;">
      <div class="prim-sym">${p.sym}</div>
      <div class="prim-word">${p.word}</div>
      <div class="prim-color-row"><span class="dot" style="background:${bg};"></span>${p.name}</div>
    </div>`
  }).join('')

  const modCards = g.modifiers.map(m =>
    `<div class="mod-card">
      <div class="mod-sym">${m.sym}</div>
      <div class="mod-word">${m.word}</div>
      <div class="mod-rule">${m.rule}</div>
    </div>`
  ).join('')

  const legend = `<div class="legend">
    <div class="legend-section-title">Primitives</div>
    <div class="prim-grid">${primCards}</div>
    <div class="legend-section-title">Modifiers</div>
    <div class="mod-row">${modCards}</div>
  </div>`

  const stages = g.stages.map(s =>
    `<div class="stage-section">
      <div class="stage-header">Stage ${s.num}${s.num === 4 ? ' — post-training (all operators combined)' : ''}</div>
      <div class="stage-cols">
        <div><div class="col-label">Train</div>${s.train.map(r => renderStimRow(r, g)).join('')}</div>
        <div><div class="col-label">Test</div>${s.test.map(r => renderStimRow(r, g)).join('')}</div>
      </div>
    </div>`
  ).join('')

  return legend + stages
}

// ── tabs / state ──────────────────────────────────────────────────────────────

const cache = {}
let current = GRAMMAR_NUMS[0]

function renderTabs() {
  document.getElementById('tabs').innerHTML = GRAMMAR_NUMS.map(n =>
    `<button class="tab-btn${n === current ? ' active' : ''}" onclick="selectGrammar(${n})">Grammar ${n}</button>`
  ).join('')
}

async function selectGrammar(n) {
  current = n
  renderTabs()
  const viz = document.getElementById('viz')
  if (!cache[n]) {
    viz.innerHTML = '<p class="status">Loading…</p>'
    try {
      cache[n] = await loadGrammar(n)
    } catch (e) {
      viz.innerHTML = `<p class="error">Error loading grammar ${n}: ${e.message}</p>`
      return
    }
  }
  viz.innerHTML = renderGrammarHTML(cache[n])
}

renderTabs()
selectGrammar(current)
</script>
</body>
</html>
